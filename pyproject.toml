[project]
name = "datasette-publish-fly"
version = "1.3.1"
description = "Datasette plugin for publishing data using Fly"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
dependencies = ["datasette>=0.60.2"]

[project.urls]
Homepage = "https://github.com/simonw/datasette-publish-fly"
Issues = "https://github.com/simonw/datasette-publish-fly/issues"
CI = "https://github.com/simonw/datasette-publish-fly/actions"
Changelog = "https://github.com/simonw/datasette-publish-fly/releases"

[project.optional-dependencies]
test = ["pytest", "pytest-mock", "cogapp"]

[project.entry-points.datasette]
publish_fly = "datasette_publish_fly"

[dependency-groups]
dev = ["pytest", "pytest-mock", "cogapp"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**"]
